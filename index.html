<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anneme Mutlu Yıllar</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="heart-icon">&#10084;</div>
            <h1>İyi ki doğdun anneciğim!</h1>
            <p>Bugün senin günün. Senin için güzel dilekler, sevgi dolu kalpler hazırladım.</p>
            <div class="buttons">
                <button id="addHeart">Kalp Gönder</button>
                <button id="complimentBtn" class="secondary">İltifat Gönder</button>
            </div>
            <div class="gift-wrap">
                <button id="gift" class="gift" aria-label="Hediye kutusu">🎁</button>
            </div>
            <div id="compliment" class="compliment" aria-live="polite"></div>
            <div id="cake" class="cake" role="button" aria-label="Doğum günü pastası">
                <svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- bottom (largest) tier -->
                    <rect x="40" y="100" width="180" height="44" rx="12" fill="#FFD6A5" stroke="#FFB36A" />
                    <!-- middle tier -->
                    <rect x="60" y="64" width="140" height="36" rx="10" fill="#FFD1E8" stroke="#FF9ECB" />
                    <!-- top (smallest) tier -->
                    <rect x="92" y="36" width="76" height="28" rx="8" fill="#C6F6D5" stroke="#7EE7B5" />

                    <!-- candles -->
                    <g id="candles">
                        <rect x="100" y="8" width="6" height="22" class="candle" />
                        <rect x="118" y="8" width="6" height="22" class="candle" />
                        <rect x="136" y="8" width="6" height="22" class="candle" />
                        <rect x="82" y="8" width="6" height="22" class="candle" />
                    </g>

                    <!-- flames: outer yellow + inner orange -->
                    <g class="flames">
                      <g class="flame" transform="translate(103,6)"><ellipse rx="5" ry="7" fill="#FFD24D"/><ellipse rx="2.6" ry="4" fill="#FF6B6B"/></g>
                      <g class="flame" transform="translate(121,6)"><ellipse rx="5" ry="7" fill="#FFD24D"/><ellipse rx="2.6" ry="4" fill="#FF6B6B"/></g>
                      <g class="flame" transform="translate(139,6)"><ellipse rx="5" ry="7" fill="#FFD24D"/><ellipse rx="2.6" ry="4" fill="#FF6B6B"/></g>
                      <g class="flame" transform="translate(85,6)"><ellipse rx="5" ry="7" fill="#FFD24D"/><ellipse rx="2.6" ry="4" fill="#FF6B6B"/></g>
                    </g>
                </svg>
            </div>
        </div>
        <div class="hearts" id="hearts"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
